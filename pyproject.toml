[project]
name = "rag-release-gate"
version = "0.1.0"
description = "A live evaluation and release-quality gate for a RAG assistant."
readme = "README.md"
authors = [
    { name = "Maria", email = "marimuur08@gmail.com" }
]
# Upper bound is deliberate: the lockfile pins packages, not the interpreter,
# and 3.13 is an untested runtime for this project. See .python-version.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly, not ranged. T01 proved OpenRouter routing is correct in
    # THIS version; #2626 describes the silent-fallback defect in 4.0.x. That
    # evidence is a fact about a version, so the version does not float.
    "deepeval==4.1.3",
    "numpy>=2.5.1",
    "openai>=2.51.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
]

# Deliberately absent — do not add without re-opening the decision:
#   chromadb / onnxruntime / sentence-transformers  — no vector DB at ~80 chunks (premise 3)
#   litellm     — T01 never needed it; the native and adapter paths both worked
#   instructor  — T01 proved both pinned models honour response_format JSON Schema

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are opt-in, always. `-m live` runs the release gate and spends money.
# --strict-markers turns a typo like @pytest.mark.liv into an error instead of a
# warning; without it, a mistyped marker silently deselects nothing and a paid
# test runs on every push.
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: requires OPENROUTER_API_KEY, makes real API calls, costs money. Deselected by default.",
]

[tool.ruff]
line-length = 100
# spike/ is throwaway T01 probe code with its own environment and its own
# pyproject.toml. It is kept as evidence, not maintained as project code.
exclude = ["spike"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
